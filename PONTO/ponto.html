<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POLÍCIA CIA: Controle de Ponto</title>
<link rel="icon" href="https://imaging.habblet.city/badge/b0913s02154s01134s19114s17118">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    :root { font-size: 16px !important; }
    body {
        background-color: #f3f4f6;
        font-family: 'Plus Jakarta Sans', sans-serif;
        color: #1f2937;
        margin: 0;
        line-height: 1.5;
    }

    .glass-card {
        background: #ffffff;
        border-radius: 24px;
        border: 1px solid #e5e7eb;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
    }

    .category-title {
        font-size: 0.6rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: #d1d5db;
        margin: 0 0 1rem;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-form { animation: fadeIn 0.3s ease-out forwards; }

    .avatar-head {
        width: 44px;
        height: 44px;
        border-radius: 9999px;
        overflow: hidden;
        background: #00000038;
        flex-shrink: 0;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .avatar-head img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
        display: none;
        transform: scale(2);
        transform-origin: center 25%;
        top: -18px;
    }
    .avatar-head img.pronto { display: block; }
    .avatar-head .avatar-inicial {
        color: #fff; font-weight: 700; font-size: 14px; position: relative; z-index: 0;
    }
    .avatar-head img.pronto ~ .avatar-inicial { display: none; }

    .btn-tipo { transition: all 0.15s ease; }
    .btn-tipo:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn-tipo:active { transform: translateY(0); filter: brightness(0.95); }
    .btn-tipo:disabled { opacity: 0.5; pointer-events: none; }

    .roster-row { transition: background 0.15s ease; }
    .roster-row:hover { background-color: #f9fafb; }

    .modern-input {
        width: 100%;
        padding: 10px 0;
        border-bottom: 2px solid #e5e7eb;
        background: transparent;
        outline: none;
        transition: all 0.2s ease;
        font-weight: 600;
        font-size: 0.95rem;
        font-family: inherit;
        color: #1f2937;
    }
    .modern-input:focus { border-bottom-color: #3b82f6; }

    .input-label {
        font-size: 0.65rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #9ca3af;
        display: block;
        margin-bottom: 2px;
    }

    .suggest-dropdown {
        position: absolute; z-index: 40; top: 100%; left: 0; width: 100%; margin-top: 4px;
        background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px;
        max-height: 180px; overflow-y: auto; display: none;
        box-shadow: 0 12px 24px rgba(15, 23, 42, .1);
    }
    .suggest-dropdown .item {
        padding: 9px 14px; font-size: 0.8rem; cursor: pointer;
        display: flex; justify-content: space-between; gap: 10px;
        border-bottom: 1px solid #f3f4f6;
    }
    .suggest-dropdown .item:last-child { border-bottom: none; }
    .suggest-dropdown .item:hover { background: #eff6ff; }
    .suggest-dropdown .item .patente { color: #9ca3af; font-size: 0.7rem; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
</style>
</head>
<body class="min-h-screen">

<!-- NAVBAR -->
<nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-20 items-center">
            <div class="flex items-center gap-2">
                <div class="bg-[#8f6f3d] p-2 rounded-xl shadow-lg shadow-blue-200 flex items-center justify-center">
                    <img src="https://imaging.habblet.city/badge/b0913s02154s01134s19114s17118" />
                </div>
                <div class="leading-none">
                    <span class="text-xl font-black tracking-tighter text-gray-900 uppercase block">Polícia CIA</span>
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Controle de Ponto</span>
                </div>
            </div>
            <div class="text-right leading-none">
                <div id="clockTime" class="text-lg font-extrabold text-gray-800 tabular-nums">--:--:--</div>
                <div id="clockDate" class="text-[11px] font-bold text-gray-400 mt-1">--/--/----</div>
            </div>
        </div>
    </div>
</nav><div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 pb-16 space-y-6">

    <!-- BATER PONTO -->
    <section class="glass-card p-6 md:p-8">

        <!-- estado: identificando via sessão do fórum -->
        <div id="identidade_carregando" class="flex items-center gap-2 text-gray-400 mb-5">
            <i class="fas fa-spinner fa-spin text-sm"></i>
            <span class="text-xs font-bold">Identificando...</span>
        </div>

        <!-- estado: identificado com sucesso -->
        <div id="identidade_ok" class="hidden items-center gap-3 mb-5">
            <div class="avatar-head" style="width:52px;height:52px;background: none;top: -8px;">
                <img id="autor_avatar" data-nick="" alt="">
                <span id="autor_avatar_inicial" class="avatar-inicial" style="font-size:16px"></span>
            </div>
            <div>
                <p class="text-lg font-extrabold text-gray-800 leading-tight">Olá, <span id="autor_nick_display">---</span>.</p>
                <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Registre seu ponto aqui:</p>
            </div>
        </div>

        <!-- estado: não foi possível identificar automaticamente -->
        <div id="identidade_manual" class="hidden relative mb-5">
            <label class="input-label">Confirme seu nickname</label>
            <input id="autor_nick_manual" type="text" class="modern-input" placeholder="Comece a digitar para buscar" autocomplete="off">
            <p class="text-[10px] text-gray-400 mt-1">Não conseguimos identificar você automaticamente pela sessão do fórum.</p>
        </div>

        <div class="flex gap-3">
            <button id="btnEntrada" disabled class="btn-tipo flex-1 flex items-center justify-center gap-2 px-5 py-3.5 rounded-2xl bg-emerald-500 text-white text-sm font-bold shadow-sm shadow-emerald-200">
                <i class="fa-solid fa-right-to-bracket"></i> Iniciar
            </button>
            <button id="btnSaida" disabled class="btn-tipo flex-1 flex items-center justify-center gap-2 px-5 py-3.5 rounded-2xl bg-rose-500 text-white text-sm font-bold shadow-sm shadow-rose-200">
                <i class="fa-solid fa-right-from-bracket"></i> Finalizar
            </button>
        </div>
        <p id="feedback" class="text-xs font-semibold text-gray-400 mt-3 min-h-[16px]"></p>
    </section>

    <!-- LISTA DE MILITARES -->
    <section class="glass-card p-6 md:p-8">
        <div class="flex items-center justify-between mb-2">
            <p class="category-title mb-0">Militares</p>
            <span id="totalMilitares" class="text-[10px] font-black text-gray-300 uppercase tracking-widest"></span>
        </div>
        <div id="rosterList" class="divide-y divide-gray-50">
            <div class="py-16 text-center">
                <i class="fas fa-spinner fa-spin text-2xl text-blue-500 mb-3"></i>
                <p class="text-gray-400 font-bold uppercase tracking-widest text-xs">Sincronizando dados...</p>
            </div>
        </div>
    </section>
</div>

<!-- MODAL HISTÓRICO --><div id="modal_bg" class="hidden fixed inset-0 z-[150] bg-gray-900/60 backdrop-blur-sm items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 md:p-8 max-w-lg w-full shadow-2xl relative animate-form max-h-[85vh] overflow-y-auto">
        <button id="btn_fechar_modal" class="absolute top-4 right-4 text-gray-300 hover:text-gray-500">
            <i class="fas fa-xmark text-lg"></i>
        </button>

        <div class="flex items-center gap-3 mb-6">
            <div class="avatar-head" style="width:52px;height:52px">
                <img id="m_avatar" data-nick="" alt="">
                <span id="m_avatar_inicial" class="avatar-inicial" style="font-size:16px"></span>
            </div>
            <div>
                <h3 id="m_nome" class="text-lg font-extrabold text-gray-800 leading-tight">---</h3>
                <p class="text-[11px] font-bold text-gray-400 uppercase tracking-widest">Histórico de ponto</p>
            </div>
        </div>

        <div class="hidden md:grid grid-cols-[1fr_1fr_1fr] gap-4 px-2 py-2 text-[10px] font-black text-gray-400 uppercase tracking-widest border-b border-gray-100">
            <span>Data</span>
            <span>Horário</span>
            <span>Tipo</span>
        </div>
        <div id="histBody" class="divide-y divide-gray-50"></div>
    </div>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
   * CONFIGURAÇÃO
   * ============================================================ */

  // Cole aqui a URL do seu Worker Cloudflare (algo como
  // https://cia-controle-ponto.SEU-SUBDOMINIO.workers.dev)
  var WORKER_URL = "https://ciaponto.workers.dev";

  var HABBLET_API = 'https://api.habblet.city';
  var HABBLET_IMAGING = 'https://imaging.habblet.city/avatarimage';

  // Planilha "CIA: Listagens" — usada só para identificar o nickname da
  // sessão e (no fallback manual) sugerir nicknames válidos
  var SHEET_ID = '1eiyugYk_lTFAIAQW4Zgm9TDZg5m3f5chLX8Zmlqa76U';
  var URL_PRACAS    = 'https://opensheet.elk.sh/' + SHEET_ID + '/Corpo+de+Praças';
  var URL_OFICIAIS  = 'https://opensheet.elk.sh/' + SHEET_ID + '/Corpo+de+Oficiais';
  var URL_EXECUTIVO = 'https://opensheet.elk.sh/' + SHEET_ID + '/Corpo+Executivo';

  var rosterList = document.getElementById('rosterList');
  var feedback = document.getElementById('feedback');
  var totalMilitares = document.getElementById('totalMilitares');
  var modal = document.getElementById('modal_bg');
  var histBody = document.getElementById('histBody');
  var btnEntrada = document.getElementById('btnEntrada');
  var btnSaida = document.getElementById('btnSaida');

  var autor = null; // { nick, patente }

  function urlConfigured(){
    return WORKER_URL && WORKER_URL.indexOf('COLOQUE_AQUI') !== 0;
  }

  /* ============================================================
   * RELÓGIO
   * ============================================================ */

  function setClock(){
    var now = new Date();
    document.getElementById('clockTime').textContent = now.toLocaleTimeString('pt-BR');
    document.getElementById('clockDate').textContent = now.toLocaleDateString('pt-BR');
  }
  setClock();
  setInterval(setClock, 1000);

  /* ============================================================
   * AVATAR (Habblet) — cabeça do boneco
   * ============================================================ */

  var cacheFiguras = {};

  function fetchComTimeout(url, opcoes, ms) {
    ms = ms || 6000;
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, ms);
    opcoes = Object.assign({}, opcoes, { signal: controller.signal });
    return fetch(url, opcoes).finally(function () { clearTimeout(timer); });
  }

  function encodeNickParaApi(nick) {
    return encodeURIComponent(nick).replace(/%40/g, '@').replace(/%2C/g, ',').replace(/%3A/g, ':').replace(/%2E/g, '.');
  }

  function buscarPlayer(nick) {
    return fetchComTimeout(HABBLET_API + '/player/' + encodeNickParaApi(nick))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (dados) { return (dados && dados.figure) ? dados.figure : null; })
      .catch(function () { return null; });
  }

  function buscarFigura(nick) {
    var chave = nick.toLowerCase();
    if (cacheFiguras.hasOwnProperty(chave)) return Promise.resolve(cacheFiguras[chave]);

    var limpo = nick.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');

    return buscarPlayer(nick).then(function (figura) {
      if (figura || !limpo || limpo === nick) {
        cacheFiguras[chave] = figura;
        return figura;
      }
      return buscarPlayer(limpo).then(function (figura2) {
        cacheFiguras[chave] = figura2;
        return figura2;
      });
    });
  }

  function urlAvatarCabeca(figura) {
    return HABBLET_IMAGING + '?figure=' + encodeURIComponent(figura) +
      '&headonly=1&direction=2&head_direction=2&size=m&img_format=png';
  }

  function carregarAvatares(nicknames) {
    var unicos = Array.from(new Set(nicknames.filter(Boolean)));
    unicos.forEach(function (nick) {
      buscarFigura(nick).then(function (figura) {
        if (!figura) return;
        var url = urlAvatarCabeca(figura);
        document.querySelectorAll('img[data-nick="' + nick.replace(/"/g, '\\"') + '"]').forEach(function (img) {
          img.onload = function () { img.classList.add('pronto'); };
          img.onerror = function () { img.classList.remove('pronto'); };
          img.src = url;
        });
      });
    });
  }

  function inicial(nome) { return (nome || '?').trim().charAt(0).toUpperCase() || '?'; }
  function escapeHtml(txt) { return String(txt).replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '&quot;'); }

  /* ============================================================
   * SESSÃO — identifica automaticamente o militar logado no fórum,
   * lendo a própria página /forum (mesma origem, sem backend).
   * Se não conseguir, cai no fallback manual.
   * ============================================================ */

  var listaUsuarios = [];       // [{ nickname, patente }]
  var patentePorNickname = {};  // { "nicklower": {nickname, patente} }

  function capitalizar(texto) {
    return texto.toLowerCase().replace(/(^|[\s\-\/])\S/g, function (c) { return c.toUpperCase(); });
  }

  function parsePatente(valor, patente) {
    if (!valor) return null;
    var m = valor.match(/^(.*)\s\[([^\]]+)\]\s.+$/);
    if (!m) return null;
    return { nickname: m[1].trim(), patente: capitalizar(patente.trim()) };
  }

  function carregarPatentes(url) {
    return fetchComTimeout(url)
      .then(function (r) { return r.json(); })
      .then(function (linhas) {
        linhas.forEach(function (linha) {
          Object.keys(linha).forEach(function (patente) {
            var u = parsePatente(linha[patente], patente);
            if (!u) return;
            listaUsuarios.push(u);
            patentePorNickname[u.nickname.toLowerCase()] = u;
          });
        });
      })
      .catch(function (err) { console.error('[dados] falha ao ler ' + url, err); });
  }

  function carregarListagem() {
    return Promise.all([
      carregarPatentes(URL_PRACAS),
      carregarPatentes(URL_OFICIAIS),
      carregarPatentes(URL_EXECUTIVO)
    ]);
  }

  function resolverAutor(nick) {
    var registro = patentePorNickname[nick.toLowerCase()];
    if (registro) return { nick: registro.nickname, patente: registro.patente };
    // se não estiver na listagem de patentes, ainda assim permite bater
    // ponto com o nick detectado na sessão
    return { nick: nick, patente: '' };
  }

  function detectarSessaoForum() {
    return fetchComTimeout('/forum')
      .then(function (r) { return r.text(); })
      .then(function (html) {
        var mLogado = html.match(/_userdata\["session_logged_in"\]\s*=\s*(\d+)/);
        var logado = mLogado ? mLogado[1] === '1' : true;
        var mNick = html.match(/_userdata\["username"\]\s*=\s*"([^"]+)"/);
        var nick = (mNick && mNick[1].toLowerCase() !== 'anonymous') ? mNick[1] : null;
        return { logado: logado, nick: nick };
      })
      .catch(function () { return { logado: true, nick: null }; });
  }

  function definirAutor(dados) {
    autor = dados;
    document.getElementById('identidade_carregando').classList.add('hidden');
    document.getElementById('identidade_manual').classList.add('hidden');

    var bloco = document.getElementById('identidade_ok');
    bloco.classList.remove('hidden');
    bloco.classList.add('flex');
    document.getElementById('autor_nick_display').textContent = autor.nick;
    document.getElementById('autor_avatar_inicial').textContent = inicial(autor.nick);
    document.getElementById('autor_avatar').dataset.nick = autor.nick;
    carregarAvatares([autor.nick]);

    btnEntrada.disabled = false;
    btnSaida.disabled = false;
  }

  function ativarAutocomplete(inputEl, aoSelecionar) {
    if (!inputEl) return;
    var wrapper = inputEl.parentElement;
    if (getComputedStyle(wrapper).position === 'static') wrapper.style.position = 'relative';

    var dropdown = document.createElement('div');
    dropdown.className = 'suggest-dropdown';
    wrapper.appendChild(dropdown);

    inputEl.addEventListener('input', function () {
      var termo = this.value.trim().toLowerCase();
      dropdown.innerHTML = '';
      if (termo.length < 2) { dropdown.style.display = 'none'; return; }

      var resultados = listaUsuarios
        .filter(function (u) { return u.nickname.toLowerCase().indexOf(termo) !== -1; })
        .slice(0, 8);
      if (resultados.length === 0) { dropdown.style.display = 'none'; return; }

      resultados.forEach(function (u) {
        var item = document.createElement('div');
        item.className = 'item';
        item.innerHTML = '<span>' + escapeHtml(u.nickname) + '</span><span class="patente">' + escapeHtml(u.patente) + '</span>';
        item.addEventListener('click', function () {
          inputEl.value = u.nickname;
          dropdown.style.display = 'none';
          aoSelecionar(u);
        });
        dropdown.appendChild(item);
      });
      dropdown.style.display = 'block';
    });

    document.addEventListener('click', function (e) {
      if (e.target !== inputEl) dropdown.style.display = 'none';
    });
  }

  function mostrarIdentificacaoManual() {
    document.getElementById('identidade_carregando').classList.add('hidden');
    document.getElementById('identidade_manual').classList.remove('hidden');
    ativarAutocomplete(document.getElementById('autor_nick_manual'), function (u) {
      definirAutor({ nick: u.nickname, patente: u.patente });
    });
  }

  /* ============================================================
   * LISTA DE MILITARES (registros de ponto)
   * ============================================================ */

  function badgeStatus(status){
    if (status === 'Iniciado') return 'bg-emerald-100 text-emerald-700';
    if (status === 'Finalizado') return 'bg-rose-100 text-rose-700';
    return 'bg-gray-100 text-gray-600';
  }

  function carregarLista(){
    if (!urlConfigured()){
      rosterList.innerHTML = '<div class="py-16 text-center text-gray-400 font-bold text-sm">Configure a URL do Worker no código para carregar os registros.</div>';
      return;
    }
    fetch(WORKER_URL).then(function(res){ return res.json(); }).then(function(data){
      var militares = data.militares || [];
      totalMilitares.textContent = militares.length + (militares.length === 1 ? ' registrado' : ' registrados');

      if (militares.length === 0){
        rosterList.innerHTML = '<div class="py-16 text-center text-gray-400 font-bold text-sm">Nenhum ponto registrado ainda.</div>';
        return;
      }

      rosterList.innerHTML = militares.map(function(m){
        var nickSeguro = escapeHtml(m.nome);
        return (
          '<div class="roster-row flex items-center justify-between gap-3 py-3 px-2 cursor-pointer rounded-xl" data-nome="' + nickSeguro + '">' +
            '<div class="flex items-center gap-3">' +
              '<div class="avatar-head">' +
                '<img data-nick="' + nickSeguro + '" alt="">' +
                '<span class="avatar-inicial">' + inicial(m.nome) + '</span>' +
              '</div>' +
              '<span class="font-bold text-gray-800 text-sm">' + nickSeguro + '</span>' +
            '</div>' +
            '<span class="text-xs font-bold px-3 py-1 rounded-full ' + badgeStatus(m.ultimoStatus) + '">' + m.ultimoStatus + '</span>' +
          '</div>'
        );
      }).join('');

      rosterList.querySelectorAll('[data-nome]').forEach(function(el){
        el.addEventListener('click', function(){ abrirHistorico(el.dataset.nome); });
      });

      carregarAvatares(militares.map(function(m){ return m.nome; }));
    }).catch(function(){
      rosterList.innerHTML = '<div class="py-16 text-center text-rose-500 font-bold text-sm">Não foi possível carregar os registros agora.</div>';
    });
  }

  /* ============================================================
   * MODAL DE HISTÓRICO
   * ============================================================ */

  function abrirHistorico(nome){
    document.getElementById('m_nome').textContent = nome;
    document.getElementById('m_avatar_inicial').textContent = inicial(nome);
    var avatarImg = document.getElementById('m_avatar');
    avatarImg.classList.remove('pronto');
    avatarImg.dataset.nick = nome;

    histBody.innerHTML = '<div class="py-10 text-center text-gray-400 font-bold text-xs uppercase tracking-widest"><i class="fas fa-spinner fa-spin mr-2"></i>Carregando...</div>';
    modal.classList.remove('hidden');
    modal.classList.add('flex');

    carregarAvatares([nome]);

    fetch(WORKER_URL + '?action=history&nome=' + encodeURIComponent(nome))
      .then(function(res){ return res.json(); })
      .then(function(data){
        var registros = data.registros || [];
        if (registros.length === 0){
          histBody.innerHTML = '<div class="py-10 text-center text-gray-400 font-bold text-xs">Sem registros.</div>';
          return;
        }
        histBody.innerHTML = registros.map(function(r){
          return (
            '<div class="grid grid-cols-1 md:grid-cols-[1fr_1fr_1fr] gap-2 md:gap-4 px-2 py-3 items-center">' +
              '<span class="text-sm font-semibold text-gray-700">' + r.data + '</span>' +
              '<span class="text-sm font-semibold text-gray-500">' + r.horario + '</span>' +
              '<span class="inline-block w-fit text-xs font-bold px-2.5 py-1 rounded-full ' + badgeStatus(r.tipo) + '">' + r.tipo + '</span>' +
            '</div>'
          );
        }).join('');
      })
      .catch(function(){
        histBody.innerHTML = '<div class="py-10 text-center text-rose-500 font-bold text-xs">Erro ao carregar histórico.</div>';
      });
  }

  document.getElementById('btn_fechar_modal').addEventListener('click', function(){
    modal.classList.add('hidden'); modal.classList.remove('flex');
  });
  modal.addEventListener('click', function(e){
    if (e.target === modal){ modal.classList.add('hidden'); modal.classList.remove('flex'); }
  });

  /* ============================================================
   * BATER PONTO
   * ============================================================ */

  function baterPonto(tipo){
    if (!autor){
      feedback.textContent = 'Confirme sua identificação antes de bater o ponto.';
      feedback.className = 'text-xs font-semibold text-rose-500 mt-3 min-h-[16px]';
      return;
    }
    if (!urlConfigured()){
      feedback.textContent = 'Configure a URL do Worker no código antes de usar.';
      feedback.className = 'text-xs font-semibold text-rose-500 mt-3 min-h-[16px]';
      return;
    }
    feedback.textContent = 'Registrando...';
    feedback.className = 'text-xs font-semibold text-gray-400 mt-3 min-h-[16px]';

    fetch(WORKER_URL, { method: 'POST', body: JSON.stringify({ nome: autor.nick, tipo: tipo }) })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data.ok){
          feedback.textContent = 'Ponto registrado: ' + autor.nick + ' — ' + tipo + '.';
          feedback.className = 'text-xs font-semibold text-emerald-600 mt-3 min-h-[16px]';
          carregarLista();
        } else {
          feedback.textContent = data.erro || 'Erro ao registrar o ponto.';
          feedback.className = 'text-xs font-semibold text-rose-500 mt-3 min-h-[16px]';
        }
      })
      .catch(function(){
        feedback.textContent = 'Erro ao registrar o ponto.';
        feedback.className = 'text-xs font-semibold text-rose-500 mt-3 min-h-[16px]';
      });
  }

  btnEntrada.addEventListener('click', function(){ baterPonto('Iniciado'); });
  btnSaida.addEventListener('click', function(){ baterPonto('Finalizado'); });

  /* ============================================================
   * INIT
   * ============================================================ */

  document.addEventListener('DOMContentLoaded', function () {
    carregarLista();

    carregarListagem().then(function () {
      detectarSessaoForum().then(function (sessao) {
        var dadosAutor = sessao.nick ? resolverAutor(sessao.nick) : null;
        if (dadosAutor) {
          definirAutor(dadosAutor);
        } else {
          mostrarIdentificacaoManual();
        }
      });
    });
  });
})();
</script>
</body>
</html>
